<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23182024%22/><circle cx=%2223%22 cy=%2236%22 r=%226%22 fill=%22%23fff8e7%22/><circle cx=%2236%22 cy=%2231%22 r=%226%22 fill=%22%23e9dfc8%22/><circle cx=%2243%22 cy=%2241%22 r=%226%22 fill=%22%23fff8e7%22/></svg>" />
    <title>SaltWatch Card demo</title>
    <style>
      :root {
        color-scheme: dark;
        --primary-text-color: #f4f6f7;
        --secondary-text-color: #aeb6bb;
        --ha-card-background: #181d21;
        --divider-color: #536069;
        --primary-color: #57c878;
        --ha-card-border-radius: 20px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 14% 0%, rgba(51, 88, 72, .22), transparent 32rem),
          linear-gradient(180deg, #101519, #090c0e);
        color: var(--primary-text-color);
      }
      main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 64px; }
      .eyebrow { margin: 0 0 6px; color: #57c878; font-size: 12px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); letter-spacing: -.045em; }
      .intro { margin: 10px 0 26px; color: var(--secondary-text-color); }
      .controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:20px; padding:14px; border:1px solid rgba(255,255,255,.08); border-radius:14px; background:rgba(255,255,255,.025); }
      label { display:flex; align-items:center; gap:10px; color:var(--secondary-text-color); }
      input[type="range"] { width:min(280px,42vw); accent-color:#f4ad32; }
      button { padding:8px 13px; border:1px solid rgba(255,255,255,.12); border-radius:9px; color:var(--primary-text-color); background:#20272c; cursor:pointer; font:inherit; }
      button:hover { background:#293238; }
      .demo-frame { max-width:1060px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Development preview</p>
      <h1>SaltWatch Card</h1>
      <p class="intro">The controls simulate Home Assistant entity updates.</p>
      <div class="controls">
        <label>Estimated level <input id="level" type="range" min="0" max="100" value="62" /><strong id="level-value">62%</strong></label>
        <button data-state="good">Good</button>
        <button data-state="low">Low salt</button>
        <button data-state="fault">Sensor fault</button>
        <button data-state="calibration">Calibration required</button>
      </div>
      <div class="demo-frame"><saltwatch-card id="card"></saltwatch-card></div>
    </main>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
