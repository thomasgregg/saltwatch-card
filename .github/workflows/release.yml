name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Verify version-specific release notes
        run: test -s ".github/release-notes/${GITHUB_REF_NAME}.md"
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/saltwatch-card.js
          --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"
          --title "SaltWatch Card $GITHUB_REF_NAME"
