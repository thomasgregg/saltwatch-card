name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Verify version-specific release notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -s "$notes"
          if grep -Eiq '^[[:space:]]{0,3}#{1,6}[[:blank:]]+SaltWatch Card[[:blank:]]+v?[0-9]+[.][0-9]+[.][0-9]+' "$notes"; then
            echo "Remove the version heading from $notes. GitHub shows the version in the release title."
            exit 1
          fi
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/saltwatch-card.js \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --title "SaltWatch Card $GITHUB_REF_NAME" \
            "${prerelease[@]}"
